<title>우리팀 커피 주문 키오스크</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
/* 호스팅 래퍼가 본문의 viewport 메타를 head로 옮기지 않는 경우가 있어 직접 보장 */
(function(){
  if(!document.head.querySelector('meta[name="viewport"]')){
    var m = document.createElement('meta');
    m.name = 'viewport';
    m.content = 'width=device-width, initial-scale=1, viewport-fit=cover';
    document.head.appendChild(m);
  }
})();
</script>
<style>
  /* ── 키오스크 라이트 테마(단일 테마 확정) ───────────────────── */
  :root{
    --bg:#eef1f5;
    --panel:#f7f8fa;
    --card:#ffffff;
    --line:#e3e7ee;
    --ink:#1c2430;
    --ink-soft:#5b6675;
    --ink-faint:#98a2b3;
    --blue:#2f80ed;
    --blue-soft:#e7f0fd;
    --navy:#141a23;
    --orange:#f7941e;
    --orange-deep:#e07f0a;
    --red:#e5484d;
    --good:#1a9e5c;
    --radius:14px;
    --shadow:0 10px 30px rgba(20,26,35,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
  input{font:inherit}

  /* 고정 높이 키오스크: 화면 안쪽 영역만 스크롤되어 사이드탭·버튼이 항상 보인다 */
  .kiosk{
    max-width:560px;height:100dvh;margin:0 auto;
    background:var(--panel);
    box-shadow:var(--shadow);
    display:flex;flex-direction:column;position:relative;overflow:hidden;
  }
  @media (min-width:600px){
    .kiosk{height:calc(100dvh - 32px);margin:16px auto;border-radius:24px;border:8px solid #2b2f36}
  }

  /* ── 헤더 ─────────────────────────────────────────────────── */
  .top{
    display:flex;align-items:center;gap:10px;
    padding:14px 18px;background:var(--card);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:30;
  }
  .logo{
    width:38px;height:38px;border-radius:10px;flex:none;
    background:linear-gradient(135deg,#35b6a8,#2f80ed);
    display:grid;place-items:center;font-size:20px;color:#fff;
  }
  .top h1{font-size:15px;font-weight:800;letter-spacing:-.02em}
  .top .sub{font-size:11px;color:var(--ink-faint);font-weight:600;letter-spacing:.04em}
  .top .stats-btn{
    margin-left:auto;font-size:12px;font-weight:700;color:var(--ink-soft);
    border:1px solid var(--line);border-radius:999px;padding:7px 12px;background:var(--panel);
  }
  .top .stats-btn:hover{color:var(--blue);border-color:var(--blue)}
  .top .reset{
    margin-left:8px;font-size:12px;font-weight:700;color:var(--ink-faint);
    border:1px solid var(--line);border-radius:999px;padding:7px 12px;background:var(--panel);
  }
  .top .reset:hover{color:var(--red);border-color:var(--red)}

  /* ── 단계 표시 ─────────────────────────────────────────────── */
  .steps{
    display:flex;align-items:center;gap:6px;
    padding:12px 16px;background:var(--panel);
    position:sticky;top:67px;z-index:29;
  }
  .step{
    flex:1;text-align:center;font-size:13px;font-weight:800;
    padding:11px 4px;border-radius:999px;background:#e8ebf1;color:var(--ink-faint);
    white-space:nowrap;
  }
  .step.on{background:var(--navy);color:#fff;animation:stepPulse 1.5s ease-out infinite}
  .step.done{background:var(--blue-soft);color:var(--blue)}
  .step.done:hover{background:#d5e6fb}
  .steps .arrow{color:#c3cad6;font-size:11px;flex:none}
  @keyframes stepPulse{
    0%{box-shadow:0 0 0 0 rgba(47,128,237,.5)}
    70%{box-shadow:0 0 0 7px rgba(47,128,237,0)}
    100%{box-shadow:0 0 0 0 rgba(47,128,237,0)}
  }

  .screen{display:none;flex:1;flex-direction:column;min-height:0}
  .screen.show{display:flex}

  /* ── 시작 화면 ─────────────────────────────────────────────── */
  #scr-start{align-items:center;justify-content:center;text-align:center;gap:18px;padding:40px 24px;cursor:pointer}
  #scr-start .hello{font-size:26px;font-weight:800;line-height:1.35;letter-spacing:-.02em}
  #scr-start .brand{
    font-size:44px;font-weight:900;letter-spacing:.06em;line-height:1.05;
    background:linear-gradient(180deg,#39c2b2,#2f80ed);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  #scr-start .cup{font-size:72px;filter:drop-shadow(0 8px 14px rgba(47,128,237,.25))}
  #scr-start .touch{
    margin-top:8px;font-size:15px;font-weight:700;color:#a15c00;
    background:#fdeed8;border:1px solid #f6d6a4;border-radius:999px;padding:13px 26px;
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
  @media (prefers-reduced-motion:reduce){
    #scr-start .touch,.step.on,.who-status{animation:none}
  }

  /* ── 주문자 선택 ───────────────────────────────────────────── */
  .who-wrap{flex:1;min-height:0;padding:18px 16px 28px;overflow-y:auto}
  .who-title{font-size:20px;font-weight:800;text-align:center;margin:6px 0 4px}
  .who-desc{font-size:13px;color:var(--ink-soft);text-align:center;margin-bottom:16px}
  .who-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .who-cell{position:relative}
  .who-btn{
    width:100%;height:100%;
    background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);
    padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;
    transition:border-color .12s;
  }
  .who-btn:hover{border-color:var(--blue)}
  .who-btn .nm{font-size:14px;font-weight:800;letter-spacing:-.02em}
  .who-btn .meta{font-size:11px;font-weight:700;color:var(--ink-faint);font-variant-numeric:tabular-nums}
  .who-btn .meta.has{color:var(--blue)}
  .who-cell.off .who-btn{background:var(--panel);border-style:dashed;opacity:.75}
  .who-cell.off .who-btn .nm{color:var(--ink-faint)}
  .who-btn.add{border-style:dashed;color:var(--ink-soft);background:var(--panel)}
  .who-btn.add .nm{color:var(--blue)}
  .who-status{
    position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;
    display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--blue);
    background:var(--blue-soft);border:1.5px solid #a9ccf7;line-height:1;
    animation:dotPulse 2s ease-out infinite;
  }
  .who-status:hover{color:#fff;background:var(--blue);border-color:var(--blue)}
  @keyframes dotPulse{
    0%{box-shadow:0 0 0 0 rgba(47,128,237,.4)}
    70%{box-shadow:0 0 0 6px rgba(47,128,237,0)}
    100%{box-shadow:0 0 0 0 rgba(47,128,237,0)}
  }
  .guest-tag{
    position:absolute;top:-7px;left:8px;font-size:10px;font-weight:800;color:#fff;
    background:var(--orange);border-radius:999px;padding:2px 7px;
  }
  .st-badge{font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;color:#fff}
  .who-foot{margin-top:16px;display:flex;justify-content:center}
  .who-foot .to-summary{
    font-size:13px;font-weight:800;color:var(--blue);background:var(--blue-soft);
    border-radius:999px;padding:11px 20px;
  }

  /* ── 메뉴 화면 ─────────────────────────────────────────────── */
  .orderer-bar{
    display:flex;align-items:center;gap:8px;
    padding:10px 16px;background:var(--blue-soft);border-bottom:1px solid #d6e5fb;
    font-size:13px;font-weight:700;color:#1b5cb8;
  }
  .orderer-bar b{font-weight:900}
  .orderer-bar .switch{
    margin-left:auto;font-size:12px;font-weight:800;color:var(--blue);
    background:var(--card);border:1px solid #c9ddf9;border-radius:999px;padding:6px 12px;
  }
  .menu-body{display:flex;flex:1;min-height:0}
  .cats{
    width:104px;flex:none;padding:12px 8px;display:flex;flex-direction:column;gap:8px;
    overflow-y:auto;background:var(--panel);
  }
  .cat{
    font-size:12.5px;font-weight:800;letter-spacing:-.03em;
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:12px 4px;text-align:center;color:var(--ink-soft);
  }
  .cat.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .menu-scroll{flex:1;overflow-y:auto;padding:12px 14px 120px;scroll-behavior:smooth}
  .sec-title{font-size:19px;font-weight:900;text-align:center;margin:14px 0 12px;letter-spacing:-.02em}
  .items{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media (min-width:480px){.items{grid-template-columns:repeat(3,1fr)}}
  .item{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:8px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;
    transition:transform .1s, border-color .12s;position:relative;
  }
  .item:not(.soldout):hover{border-color:var(--blue);transform:translateY(-2px)}
  .thumb{
    width:100%;aspect-ratio:4/3;border-radius:10px;overflow:hidden;
    background:#f2ece2;
  }
  .thumb svg{width:100%;height:100%;display:block}
  .item .nm{font-size:13px;font-weight:800;text-align:center;letter-spacing:-.03em;line-height:1.3}
  .item .pr{font-size:13px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .item.soldout{opacity:.55;cursor:not-allowed}
  .soldout-badge{
    position:absolute;top:calc(50% - 34px);left:50%;transform:translate(-50%,-50%);
    background:rgba(20,26,35,.85);color:#fff;font-size:12px;font-weight:800;
    border-radius:999px;padding:6px 14px;
  }
  .cart-fab{
    position:absolute;right:18px;bottom:20px;z-index:40;
    width:88px;height:88px;border-radius:50%;
    background:var(--orange);color:#fff;box-shadow:0 12px 24px rgba(247,148,30,.4);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    font-weight:900;font-size:13px;
  }
  .cart-fab:hover{background:var(--orange-deep)}
  .cart-fab .ic{font-size:24px;line-height:1}
  .cart-fab .badge{
    position:absolute;top:2px;right:4px;min-width:24px;height:24px;border-radius:999px;
    background:var(--red);color:#fff;font-size:13px;font-weight:800;
    display:grid;place-items:center;padding:0 6px;border:2px solid #fff;
    font-variant-numeric:tabular-nums;
  }

  /* ── 모달 공통 ─────────────────────────────────────────────── */
  .modal-veil{
    position:fixed;inset:0;background:rgba(15,20,28,.45);z-index:60;
    display:none;align-items:flex-end;justify-content:center;
  }
  .modal-veil.show{display:flex}
  @media (min-width:600px){.modal-veil.show{align-items:center}}
  .modal{
    width:min(560px,100%);max-height:92dvh;overflow-y:auto;
    background:var(--card);border-radius:22px 22px 0 0;padding:20px 20px 24px;
    display:flex;flex-direction:column;gap:18px;
  }
  @media (min-width:600px){.modal{border-radius:22px}}
  .m-head{display:flex;gap:14px;align-items:flex-start}
  .m-thumb{
    width:110px;height:88px;flex:none;border-radius:12px;overflow:hidden;background:#f2ece2;
  }
  .m-thumb svg{width:100%;height:100%;display:block}
  .m-head .info{flex:1;display:flex;flex-direction:column;gap:6px}
  .m-head .nm{font-size:20px;font-weight:900;letter-spacing:-.02em}
  .m-head .pr{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
  .m-close{font-size:22px;color:var(--ink-soft);line-height:1;padding:4px 8px}
  .qty{display:flex;align-items:center;gap:14px}
  .qty button{
    width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);
    font-size:19px;font-weight:800;color:var(--blue);background:var(--card);
    display:grid;place-items:center;
  }
  .qty .n{font-size:17px;font-weight:900;min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
  .opt-group{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
  .opt-group .g-title{font-size:13.5px;font-weight:800}
  .opt-group .g-title .req{color:var(--red)}
  .opt-group .g-title .lim{color:var(--ink-faint);font-weight:700}
  .opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  @media (min-width:480px){.opts{grid-template-columns:repeat(3,1fr)}}
  .opt{
    position:relative;border:1.5px solid var(--line);border-radius:12px;background:var(--card);
    padding:12px 12px 10px;display:flex;flex-direction:column;gap:14px;text-align:left;
  }
  .opt .o-nm{font-size:13.5px;font-weight:800}
  .opt .o-pr{font-size:12.5px;font-weight:700;color:var(--ink-soft);text-align:right;font-variant-numeric:tabular-nums}
  .opt.sel{border-color:var(--blue);background:var(--blue-soft)}
  .opt.sel .o-nm{color:#1b5cb8}
  .opt .rec{
    position:absolute;top:-9px;left:8px;font-size:10px;font-weight:800;color:#fff;
    background:var(--blue);border-radius:999px;padding:2px 8px;
  }
  .m-submit{
    margin-top:2px;border-radius:999px;padding:16px;text-align:center;
    font-size:15.5px;font-weight:900;background:var(--blue);color:#fff;
  }
  .m-submit:disabled{background:#b9c6d8;cursor:not-allowed}

  /* ── 확인/입력 다이얼로그 ───────────────────────────────────── */
  .modal-veil.center{align-items:center;padding:20px}
  .dlg{
    width:min(340px,100%);background:var(--card);border-radius:18px;
    padding:22px 20px;display:flex;flex-direction:column;gap:14px;text-align:center;
  }
  .dlg .d-title{font-size:16.5px;font-weight:900}
  .dlg .d-desc{font-size:13px;color:var(--ink-soft);font-weight:600;line-height:1.5}
  .dlg input{
    border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px;width:100%;
    background:var(--panel);
  }
  .dlg{max-height:86dvh;overflow-y:auto}
  .dlg .d-btns{display:flex;flex-direction:column;gap:8px}
  .dlg .d-btns.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .dlg .d-btns.grid .d-btn{padding:11px 4px;font-size:12.5px;border-radius:10px}
  .dlg .d-btns.grid .d-btn.wide{grid-column:1/-1}
  .dlg .d-btn{border-radius:12px;padding:13px;font-weight:800;font-size:14px;background:var(--panel);border:1px solid var(--line)}
  .dlg .d-btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  .dlg .d-btn.danger{background:#fdecec;border-color:#f5c6c8;color:var(--red)}

  /* ── 메뉴확인(장바구니) ────────────────────────────────────── */
  .cart-wrap{flex:1;overflow-y:auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:14px}
  .empty{
    text-align:center;color:var(--ink-faint);font-weight:700;font-size:14px;
    padding:60px 0 20px;display:flex;flex-direction:column;gap:10px;align-items:center;
  }
  .empty .e-ic{font-size:44px}
  .p-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .p-head{
    display:flex;align-items:center;gap:8px;padding:12px 14px;
    background:var(--blue-soft);border-bottom:1px solid #d6e5fb;
  }
  .p-head .p-nm{font-size:14.5px;font-weight:900;color:#1b5cb8}
  .p-head .p-cnt{font-size:12px;font-weight:700;color:#5b8fd9}
  .p-head .p-add{
    margin-left:auto;font-size:12px;font-weight:800;color:var(--blue);
    background:var(--card);border:1px solid #c9ddf9;border-radius:999px;padding:5px 11px;
  }
  .line-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .line-item:last-of-type{border-bottom:0}
  .li-emoji{font-size:24px;flex:none}
  .li-body{flex:1;min-width:0}
  .li-nm{font-size:13.5px;font-weight:800;letter-spacing:-.02em}
  .li-opt{font-size:11.5px;color:var(--ink-soft);font-weight:600;margin-top:2px}
  .li-qty{display:flex;align-items:center;gap:8px;flex:none}
  .li-qty button{
    width:26px;height:26px;border-radius:50%;border:1px solid var(--line);
    font-size:14px;font-weight:800;color:var(--blue);display:grid;place-items:center;background:var(--card);
  }
  .li-qty .n{font-size:13px;font-weight:800;min-width:14px;text-align:center;font-variant-numeric:tabular-nums}
  .li-pr{font-size:13px;font-weight:800;flex:none;width:64px;text-align:right;font-variant-numeric:tabular-nums}
  .li-del{color:var(--ink-faint);font-size:15px;flex:none;padding:4px}
  .li-del:hover{color:var(--red)}
  .li-tumbler{
    flex:none;width:28px;height:28px;border-radius:50%;
    border:1px solid var(--line);background:var(--card);
    display:grid;place-items:center;font-size:14px;line-height:1;
    filter:grayscale(1);opacity:.5;
  }
  .li-tumbler.on{
    filter:none;opacity:1;
    border-color:var(--good);background:#e7f7ee;
  }
  .p-sum{
    display:flex;justify-content:space-between;align-items:center;
    padding:11px 14px;background:var(--panel);border-top:1px solid var(--line);
    font-size:13.5px;font-weight:800;
  }
  .p-sum .amt{color:var(--blue);font-size:15px;font-variant-numeric:tabular-nums}

  /* ── 하단 고정 바 ─────────────────────────────────────────── */
  .bottom-bar{
    position:sticky;bottom:0;z-index:35;
    background:var(--card);border-top:1px solid var(--line);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:10px;
  }
  .total-row{display:flex;justify-content:space-between;align-items:baseline}
  .total-row .lbl{font-size:13px;font-weight:800;color:var(--ink-soft)}
  .total-row .amt{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
  .btn-row{display:flex;gap:8px}
  .btn{
    flex:1;border-radius:999px;padding:14px 8px;text-align:center;
    font-size:14.5px;font-weight:900;white-space:nowrap;
  }
  .btn.ghost{background:var(--panel);border:1.5px solid var(--line);color:var(--ink-soft)}
  .btn.blue{background:var(--blue);color:#fff}
  .btn.navy{background:var(--navy);color:#fff}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  /* ── 결제하기(합계) ────────────────────────────────────────── */
  .sum-wrap{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
  .receipt{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 16px;display:flex;flex-direction:column;gap:4px;
  }
  .receipt .r-title{font-size:16px;font-weight:900;text-align:center;margin-bottom:6px}
  .receipt .r-date{font-size:12px;color:var(--ink-faint);font-weight:700;text-align:center;margin-bottom:10px}
  .r-table{width:100%;border-collapse:collapse}
  .r-table th{
    font-size:12px;font-weight:800;color:var(--ink-faint);text-align:left;
    padding:8px 4px;border-bottom:1.5px solid var(--line);letter-spacing:.04em;
  }
  .r-table th:last-child,.r-table td:last-child{text-align:right}
  .r-table td{
    font-size:13.5px;font-weight:700;padding:10px 4px;border-bottom:1px solid var(--line);
    vertical-align:top;
  }
  .r-table td .d{font-size:11.5px;color:var(--ink-soft);font-weight:600;margin-top:3px;line-height:1.5}
  .r-table td.amt{font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
  .r-total{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 4px 2px;font-size:15px;font-weight:900;
  }
  .r-total .amt{font-size:24px;color:var(--blue);font-variant-numeric:tabular-nums}
  .r-excl{
    margin-top:10px;padding:12px;border-radius:10px;background:var(--panel);
    font-size:12.5px;font-weight:700;color:var(--ink-soft);line-height:1.7;text-align:center;
  }

<script>
'use strict';
/* ───────────────────────── 데이터 ───────────────────────── */
const TEAM = ['장순철팀장','김석린실장','김민철','김성민','김종필','김훈중','신기훈','유지연','전세완','정현영','최민석','최성삼','최우종','최현수','최호진'];
const STATUS_META = {
  '휴가':{e:'🌴',c:'#e07f0a'},
  '외근':{e:'🚗',c:'#2f80ed'},
  '재택':{e:'🏠',c:'#1a9e5c'},
  '미주문':{e:'🙅',c:'#8a94a3'},
};

/* 실사풍 메뉴 이미지(SVG) — 나무 테이블 위 유리잔/머그잔 구도 */
function svgFor(v){
  const s=[];
  s.push('<rect width="160" height="120" fill="#f2ece1"/>');
  s.push('<rect y="74" width="160" height="46" fill="#c1966a"/>');
  s.push('<rect y="74" width="160" height="2.5" fill="rgba(255,255,255,.3)"/>');
  s.push('<rect y="96" width="160" height="1.5" fill="rgba(80,50,20,.12)"/>');
  s.push('<rect y="108" width="160" height="1.5" fill="rgba(80,50,20,.09)"/>');
  const shadow=(cx,rx)=>s.push(`<ellipse cx="${cx}" cy="100" rx="${rx}" ry="4.5" fill="rgba(60,35,10,.16)"/>`);
  const tall=(cx,o)=>{
    const x=cx-15, top=o.cream?34:28, bot=98, lt=top+14;
    shadow(cx,19);
    s.push(`<rect x="${x}" y="${top}" width="30" height="${bot-top}" rx="5" fill="rgba(255,255,255,.45)" stroke="rgba(90,65,40,.3)" stroke-width="1.5"/>`);
    const lh=bot-4-lt;
    if(o.layers){
      let acc=0;
      for(const [col,f] of o.layers){
        const h=lh*f, y=bot-4-acc-h;
        s.push(`<rect x="${x+3}" y="${y}" width="24" height="${h+1}" rx="3" fill="${col}"/>`);
        acc+=h;
      }
    } else {
      s.push(`<rect x="${x+3}" y="${lt}" width="24" height="${lh}" rx="3" fill="${o.c}"/>`);
    }
    if(o.ice){
      s.push(`<rect x="${x+5}" y="${lt+4}" width="9" height="9" rx="2" fill="rgba(255,255,255,.55)"/>`);
      s.push(`<rect x="${x+16}" y="${lt+15}" width="9" height="9" rx="2" fill="rgba(255,255,255,.45)"/>`);
    }
    if(o.chips){
      for(const [dx,dy] of [[6,18],[15,32],[20,12],[9,44]])
        s.push(`<circle cx="${x+3+dx}" cy="${lt+dy}" r="1.8" fill="rgba(30,15,5,.55)"/>`);
    }
    s.push(`<rect x="${x+4}" y="${top+6}" width="4" height="${bot-top-16}" rx="2" fill="rgba(255,255,255,.35)"/>`);
    if(o.cream){
      s.push(`<ellipse cx="${cx}" cy="${top}" rx="16" ry="8" fill="#fdf6ec" stroke="rgba(120,90,60,.18)"/>`);
      s.push(`<ellipse cx="${cx}" cy="${top-8}" rx="11" ry="6" fill="#fdf6ec"/>`);
      s.push(`<ellipse cx="${cx}" cy="${top-14}" rx="6" ry="4.5" fill="#fdf6ec"/>`);
      if(o.drz) s.push(`<path d="M${cx-10},${top-5} q4,-6 8,0 t8,0" fill="none" stroke="${o.drz}" stroke-width="2" stroke-linecap="round"/>`);
    }
    if(o.g) s.push(`<path d="M${cx+3},${top+1} a8,8 0 0 1 16,0 z" fill="${o.g}" stroke="#fff" stroke-width="1.5"/>`);
  };
  const mug=(cx,o)=>{
    shadow(cx,24);
    s.push(`<ellipse cx="${cx}" cy="99" rx="26" ry="4.5" fill="rgba(255,255,255,.6)" stroke="rgba(90,65,40,.2)"/>`);
    s.push(`<circle cx="${cx+22}" cy="82" r="7" fill="none" stroke="rgba(110,85,60,.45)" stroke-width="3"/>`);
    s.push(`<ellipse cx="${cx}" cy="82" rx="21" ry="15" fill="rgba(255,255,255,.55)" stroke="rgba(90,65,40,.28)" stroke-width="1.5"/>`);
    s.push(`<ellipse cx="${cx}" cy="83" rx="17" ry="11" fill="${o.c}"/>`);
    if(o.foam){
      s.push(`<ellipse cx="${cx}" cy="78" rx="17" ry="6" fill="${o.foam}"/>`);
      s.push(`<ellipse cx="${cx-4}" cy="77" rx="6" ry="2.5" fill="rgba(255,255,255,.7)"/>`);
    }
  };
  const teacup=(c)=>{
    shadow(80,30);
    s.push('<ellipse cx="80" cy="100" rx="32" ry="5" fill="rgba(255,255,255,.65)" stroke="rgba(90,65,40,.2)"/>');
    s.push('<circle cx="109" cy="82" r="6.5" fill="none" stroke="rgba(110,85,60,.45)" stroke-width="3"/>');
    s.push('<ellipse cx="80" cy="80" rx="25" ry="16" fill="rgba(255,255,255,.55)" stroke="rgba(90,65,40,.28)" stroke-width="1.5"/>');
    s.push(`<ellipse cx="80" cy="77" rx="20" ry="8" fill="${c}" opacity=".92"/>`);
    s.push('<ellipse cx="74" cy="75" rx="7" ry="2.5" fill="rgba(255,255,255,.45)"/>');
    s.push('<path d="M70,58 q3,-7 0,-13 M84,60 q3,-7 0,-13" fill="none" stroke="rgba(150,130,110,.4)" stroke-width="2" stroke-linecap="round"/>');
  };
  const bottle=(o)=>{
    shadow(80,19);
    s.push(`<rect x="72" y="20" width="16" height="9" rx="2.5" fill="${o.cap||'#4a5568'}"/>`);
    s.push(`<rect x="74" y="28" width="12" height="14" fill="${o.c}" opacity=".85"/>`);
    s.push(`<rect x="62" y="40" width="36" height="58" rx="10" fill="${o.c}" stroke="rgba(60,35,10,.18)" stroke-width="1.5"/>`);
    s.push('<rect x="66" y="58" width="28" height="20" rx="3" fill="rgba(255,255,255,.88)"/>');
    s.push(`<rect x="70" y="63" width="20" height="3" rx="1.5" fill="${o.cap||'#4a5568'}" opacity=".7"/>`);
    s.push(`<rect x="70" y="69" width="14" height="3" rx="1.5" fill="rgba(90,65,40,.35)"/>`);
    s.push('<rect x="66" y="44" width="5" height="48" rx="2.5" fill="rgba(255,255,255,.35)"/>');
  };
  const espresso=()=>{
    shadow(80,26);
    s.push('<ellipse cx="80" cy="99" rx="28" ry="5" fill="rgba(255,255,255,.65)" stroke="rgba(90,65,40,.2)"/>');
    s.push('<circle cx="104" cy="84" r="6" fill="none" stroke="rgba(110,85,60,.5)" stroke-width="3"/>');
    s.push('<ellipse cx="80" cy="84" rx="19" ry="13" fill="#fdfaf4" stroke="rgba(90,65,40,.25)" stroke-width="1.5"/>');
    s.push('<ellipse cx="80" cy="84" rx="15" ry="9" fill="#2a1608"/>');
    s.push('<ellipse cx="80" cy="81" rx="15" ry="5" fill="#c68e52"/>');
    s.push('<path d="M72,64 q3,-8 0,-15 M88,66 q3,-8 0,-15" fill="none" stroke="rgba(150,130,110,.45)" stroke-width="2" stroke-linecap="round"/>');
  };
  const shot=()=>{
    shadow(80,15);
    s.push('<rect x="66" y="56" width="28" height="42" rx="5" fill="rgba(255,255,255,.5)" stroke="rgba(90,65,40,.3)" stroke-width="1.5"/>');
    s.push('<rect x="69" y="70" width="22" height="25" rx="3" fill="#2a1608"/>');
    s.push('<rect x="69" y="70" width="22" height="6" rx="3" fill="#c68e52"/>');
    s.push('<circle cx="106" cy="50" r="12" fill="#2f80ed"/>');
    s.push('<rect x="100" y="48.5" width="12" height="3" rx="1.5" fill="#fff"/>');
    s.push('<rect x="104.5" y="44" width="3" height="12" rx="1.5" fill="#fff"/>');
  };
  const bingsu=()=>{
    shadow(80,26);
    s.push('<path d="M56,66 L104,66 L98,98 L62,98 Z" fill="rgba(255,255,255,.75)" stroke="rgba(90,65,40,.25)" stroke-width="1.5"/>');
    s.push('<ellipse cx="80" cy="64" rx="26" ry="10" fill="#fdfcf8"/>');
    s.push('<ellipse cx="80" cy="55" rx="19" ry="9" fill="#fdfcf8"/>');
    s.push('<ellipse cx="80" cy="47" rx="12" ry="7" fill="#fdfcf8"/>');
    for(const [dx,dy,r] of [[-8,52,3],[4,44,2.8],[10,54,3],[-2,58,2.6],[14,62,2.4],[-14,60,2.6]])
      s.push(`<circle cx="${80+dx}" cy="${dy}" r="${r}" fill="#6b3226"/>`);
  };
  const snack=(o)=>{
    shadow(80,28);
    s.push(`<rect x="48" y="42" width="64" height="54" rx="8" fill="${o.c}" stroke="rgba(60,35,10,.2)" stroke-width="1.5"/>`);
    s.push(`<rect x="48" y="42" width="64" height="10" rx="5" fill="rgba(255,255,255,.25)"/>`);
    s.push(`<rect x="48" y="86" width="64" height="10" rx="5" fill="rgba(0,0,0,.15)"/>`);
    s.push(`<circle cx="80" cy="68" r="13" fill="${o.c2||'#b98a52'}"/>`);
    for(const [dx,dy] of [[-5,-3],[4,2],[-1,6],[6,-5]])
      s.push(`<circle cx="${80+dx}" cy="${68+dy}" r="1.8" fill="rgba(50,25,10,.5)"/>`);
  };
  switch(v.k){
    case 'pair': tall(52,v); mug(112,{c:v.mug||v.c, foam:v.foam}); break;
    case 'tall': tall(80,v); break;
    case 'tea': teacup(v.c); break;
    case 'esp': espresso(); break;
    case 'shot': shot(); break;
    case 'bottle': bottle(v); break;
    case 'bingsu': bingsu(); break;
    case 'snack': snack(v); break;
  }
  return `<svg viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">${s.join('')}</svg>`;
}

/* ───────────────────────── 팀 공유 동기화 (textdb.online) ───────────────────────── */
const SYNC_KEY = 'dc-hj3142-q8k2x9a4-history';
const SYNC_READ = 'https://textdb.online/' + SYNC_KEY;
const SYNC_WRITE = 'https://textdb.online/update/?key=' + SYNC_KEY;
let syncStatus = {t:null, ok:null};
let syncBusy = false;
function mergeHistory(a, b){
  const map = new Map();
  [...a, ...b].forEach(h=>{ if(h && h.id && !map.has(h.id)) map.set(h.id, h); });
  const merged = [...map.values()].sort((x,y)=>x.ts-y.ts);
  while(merged.length > 600) merged.shift();   // 저장소 용량 보호
  return merged;
}
async function syncNow(){
  if(syncBusy) return false;
  syncBusy = true;
  try{
    // 클라우드 형식: {v:2, clearedAt, records:[...]} (구버전은 배열)
    let cloudCleared = 0, cloudRecords = [], cloudStr = '';
    const res = await fetch(SYNC_READ, {cache:'no-store'});
    if(res.ok){
      cloudStr = (await res.text()).trim();
      if(cloudStr){
        try{
          const p = JSON.parse(cloudStr);
          if(Array.isArray(p)) cloudRecords = p;
          else if(p && typeof p==='object'){
            cloudCleared = typeof p.clearedAt==='number'? p.clearedAt : 0;
            cloudRecords = Array.isArray(p.records)? p.records : [];
          }
        }catch(e){}
      }
    }
    // '모두 지우기' 시각 이전의 기록은 모든 기기에서 폐기
    const clearedAt = Math.max(state.clearedAt||0, cloudCleared);
    state.clearedAt = clearedAt;
    const merged = mergeHistory(cloudRecords, state.history).filter(h=>h.ts > clearedAt);
    state.history = merged; save();
    const newStr = JSON.stringify({v:2, clearedAt, records:merged});
    if(newStr !== cloudStr){
      const body = new URLSearchParams();
      body.set('value', newStr);
      const w = await fetch(SYNC_WRITE, {method:'POST', body});
      if(!w.ok) throw new Error('write ' + w.status);
    }
    syncStatus = {t:Date.now(), ok:true};
    return true;
  }catch(e){
    syncStatus = {t:Date.now(), ok:false};
    return false;
  }finally{
    syncBusy = false;
    if(document.getElementById('scr-stats').classList.contains('show')) renderStats();
  }
}

    });

    });
    let lines = [...lineMap.values()].filter(l=>(l.mt||0) > cA);

    const before = JSON.stringify(state.orders);
    state.orders = lines; state.cartTombs = tombs; save();
    const newStr = JSON.stringify({v:1, clearedAt:cA, lines, tombs});
    if(newStr !== cloudStr){
      const body = new URLSearchParams();
      body.set('value', newStr);
      const w = await fetch(CART_WRITE, {method:'POST', body});
      if(!w.ok) throw new Error('write ' + w.status);

    if(JSON.stringify(state.orders) !== before){
      updateFab();
      if($('#scr-cart').classList.contains('show')) renderCart();
      if($('#scr-who').classList.contains('show')) renderWho();
      if($('#scr-summary').classList.contains('show')) renderSummary();
    }
    return true;
  }catch(e){
    return false;
  }finally{
    cartBusy = false;
    if(cartDirty){ cartDirty = false; syncCart(); }
  }
}
function queueCartSync(){
  clearTimeout(cartPushTimer);
  cartPushTimer = setTimeout(syncCart, 1200);
}
function setCartPoll(on){
  clearInterval(cartPoll);
  cartPoll = on? setInterval(syncCart, 8000) : null;
}

/* ───────────────────────── 확인/입력 다이얼로그(샌드박스에서 confirm/prompt가 막혀 자체 구현) ── */
function dialog(o){
  return new Promise(resolve=>{
    const veil = $('#dlgVeil'), box = $('#dlgBox');
    box.innerHTML =
      `<div class="d-title">${o.title}</div>` +
      (o.desc? `<div class="d-desc">${o.desc}</div>` : '') +
      (o.input? `<input id="dlgInput" type="${o.inputType||'text'}" inputmode="${o.inputMode||'text'}" placeholder="${o.placeholder||''}" maxlength="12" autocomplete="off">` : '') +
      `<div class="d-btns${o.grid?' grid':''}">` +
      o.buttons.map((b,i)=>`<button class="d-btn ${b.style||''}" data-i="${i}">${b.label}</button>`).join('') +
      `</div>`;
    veil.classList.add('show');
    const done = v=>{ veil.classList.remove('show'); veil.onclick=null; box.onclick=null; resolve(v); };
    veil.onclick = e=>{ if(e.target===veil) done(null); };
    box.onclick = e=>{
      const b = e.target.closest('.d-btn'); if(!b) return;
      const def = o.buttons[+b.dataset.i];
      if(def.value===null) return done(null);
      const inp = $('#dlgInput');
      done({v:def.value, input: inp? inp.value.trim(): ''});
    };
    if(o.input) setTimeout(()=>{ const i=$('#dlgInput'); if(i) i.focus(); }, 60);
  });
}

/* ───────────────────────── 화면 전환 ───────────────────────── */
const SCREENS = ['start','who','menu','cart','summary','stats'];
function show(name){
  SCREENS.forEach(s=>$('#scr-'+s).classList.toggle('show', s===name));
  $('#steps').style.display = (name==='start'||name==='stats') ? 'none' : 'flex';
  const order = {who:0, menu:1, cart:2, summary:3};
  document.querySelectorAll('#steps .step').forEach((el,i)=>{
    el.classList.toggle('on', i===order[name]);
    el.classList.toggle('done', order[name]!==undefined && i<order[name]);
  });
  if(name==='who') renderWho();
  if(name==='menu') renderOrdererBar();
  if(name==='cart') renderCart();
  if(name==='summary') renderSummary();
  if(name==='stats') renderStats();
  // 공유 장바구니: 주문 관련 화면에서는 주기적으로 다른 기기 담은 내역을 가져온다
  const cartScreens = ['who','menu','cart','summary'];
  setCartPoll(cartScreens.includes(name));
  if(cartScreens.includes(name)) syncCart();
  document.querySelector('.kiosk').scrollTop = 0;
}

/* ───────────────────────── 주문자 선택 ───────────────────────── */
function personTotal(name){
  return state.orders.filter(o=>o.person===name).reduce((s,o)=>s+o.unit*o.qty,0);
}
function personCount(name){
  return state.orders.filter(o=>o.person===name).reduce((s,o)=>s+o.qty,0);
}
async function pickStatus(name){

  const r = await dialog({
    title: `${name}님 상태 표시`,
    desc: cur? `현재 상태: ${STATUS_META[cur].e} ${cur}` : '오늘 주문을 받을 수 없는 상황이면 선택해주세요',

/* ── 지난 주문 재주문 ── */
function lastOrderOf(name){
  for(let i = state.history.length-1; i >= 0; i--){
    const items = state.history[i].orders.filter(o=>o.person===name);
    if(items.length) return {
      items,
      total: items.reduce((s,o)=>s+o.unit*o.qty,0),
      date: state.history[i].date,
    };
  }
  return null;
}
async function selectPerson(n){
  state.cur = n; save();
  const last = lastOrderOf(n);
  if(last){
    const list = last.items.map(o=>`· ${orderLine(o)} — ${won(o.unit*o.qty)}`).join('<br>');
    const r = await dialog({
      title:`🕐 ${n}님의 지난 주문`,
      desc:`${last.date}<br>${list}<br><b>합계 ${won(last.total)}</b>`,
      buttons:[
        {label:'🔁 지난 주문 그대로 담기', value:'re', style:'primary'},
        {label:'새로 주문하기', value:'new'},
      ],
    });
    if(r && r.v==='re'){
      last.items.forEach(o=>{
        const exist = state.orders.find(x=>x.person===n && x.key===o.key);
        if(exist){ exist.qty += o.qty; exist.mt = Date.now(); }
        else state.orders.push({...o, lid:newLid(), ct:Date.now(), mt:Date.now(), person:n, guest:state.guests.includes(n), opts:[...(o.opts||[])]});
      });
      save(); updateFab(); queueCartSync(); show('cart');
      toast(`${n}님의 지난 주문을 그대로 담았어요 ✅`);
      return;
    }
  }
  show('menu');
}

function favItems(){ return state.favs.map(k=>ITEM_INDEX[k]).filter(Boolean); }
function toggleFav(k){

    const cb = document.createElement('button');

    }

        `<div class="thumb">${it.v? svgFor(it.v): it.e}</div>`+

/* ───────────────────────── 옵션 모달 ───────────────────────── */
let modalState = null;
function openModal(catId, itemName){
  const it = ITEM_INDEX[catId+'|'+itemName];
  modalState = { it, qty:1, temp: it.t==='iceOnly'?'ICE': it.t==='hotOnly'?'HOT': null, opts:new Set(), tumbler:false };
  renderModal();
  $('#veil').classList.add('show');
}
function closeModal(){ $('#veil').classList.remove('show'); modalState=null; }
$('#veil').addEventListener('click', e=>{ if(e.target===$('#veil')) closeModal(); });

function modalUnit(){
  const m = modalState; let u = m.it.p;
  if(m.temp==='ICE' && m.it.t==='both') u += (m.it.iceUp||0);
  m.it.o.forEach(o=>{ if(m.opts.has(o.n)) u += o.p; });
  if(m.tumbler) u -= 500;
  return u;
}
function renderModal(){
  const m = modalState, it = m.it;
  const needTemp = it.t==='both';
  const ready = !needTemp || m.temp;
  let html = `
    <div class="m-head">
      <div class="m-thumb">${it.v? svgFor(it.v): it.e}</div>
      <div class="info">
        <div class="nm">${it.n}</div>
        <div class="pr">${won(modalUnit()*m.qty)}</div>
        <div class="qty">
          <button data-act="minus" aria-label="수량 줄이기">−</button>
          <span class="n">${m.qty}</span>
          <button data-act="plus" aria-label="수량 늘리기">＋</button>
        </div>
      </div>
      <button class="m-close" data-act="close" aria-label="닫기">✕</button>
    </div>`;
  if(needTemp){
    html += `<div class="opt-group">
      <div class="g-title">HOT / ICE <span class="req">(필수 1개)</span></div>
      <div class="opts">
        <button class="opt ${m.temp==='HOT'?'sel':''}" data-temp="HOT">
          ${!it.recIce?'<span class="rec">👍 추천</span>':''}
          <span class="o-nm">HOT</span><span class="o-pr">0원</span>
        </button>
        <button class="opt ${m.temp==='ICE'?'sel':''}" data-temp="ICE">
          ${it.recIce?'<span class="rec">👍 추천</span>':''}
          <span class="o-nm">ICE</span><span class="o-pr">${it.iceUp? '+'+won(it.iceUp):'0원'}</span>
        </button>
      </div>
    </div>`;
  } else if(it.t!=='none'){
    html += `<div class="opt-group">
      <div class="g-title">HOT / ICE</div>
      <div class="opts"><button class="opt sel" disabled><span class="o-nm">${it.t==='iceOnly'?'ICE 전용':'HOT 전용'}</span><span class="o-pr">0원</span></button></div>
    </div>`;
  }
  if(it.o.length){
    html += `<div class="opt-group">
      <div class="g-title">선택 옵션 <span class="lim">(선택)</span></div>
      <div class="opts">` +
      it.o.map(o=>`<button class="opt ${m.opts.has(o.n)?'sel':''}" data-opt="${o.n}">
          ${o.rec?'<span class="rec">👍 추천</span>':''}
          <span class="o-nm">${o.n}</span><span class="o-pr">${o.p? '+'+won(o.p):'0원'}</span>
        </button>`).join('') +
      `</div></div>`;
  }
  if(!it.noTumbler){
    html += `<div class="opt-group">
      <div class="g-title">텀블러할인 <span class="lim">(선택)</span></div>
      <div class="opts">
        <button class="opt ${m.tumbler?'sel':''}" data-tumbler="1">
          <span class="o-nm">텀블러할인</span><span class="o-pr">−500원</span>
        </button>
      </div>
    </div>`;
  }
  html += `<button class="m-submit" data-act="submit" ${ready?'':'disabled'}>
    ${ready? `${state.cur}님 주문에 담기 · ${won(modalUnit()*m.qty)}` : '옵션을 선택 해주세요.'}
  </button>`;
  $('#modal').innerHTML = html;
}
$('#modal').addEventListener('click', e=>{
  const btn = e.target.closest('button'); if(!btn || !modalState) return;
  const m = modalState;
  if(btn.dataset.act==='close') return closeModal();
  if(btn.dataset.act==='minus'){ m.qty = Math.max(1, m.qty-1); }
  else if(btn.dataset.act==='plus'){ m.qty += 1; }
  else if(btn.dataset.temp){ m.temp = btn.dataset.temp; }
  else if(btn.dataset.opt){ m.opts.has(btn.dataset.opt)? m.opts.delete(btn.dataset.opt): m.opts.add(btn.dataset.opt); }
  else if(btn.dataset.tumbler){ m.tumbler = !m.tumbler; }
  else if(btn.dataset.act==='submit'){
    if(m.it.t==='both' && !m.temp) return;
    addToOrder(); return;
  }
  renderModal();
});
function addToOrder(){
  const m = modalState;
  const optArr = m.it.o.filter(o=>m.opts.has(o.n)).map(o=>o.n);
  if(m.tumbler) optArr.push('텀블러할인');
  const key = [m.it.cat, m.it.n, m.temp||'', optArr.join(',')].join('|');
  const exist = state.orders.find(o=>o.person===state.cur && o.key===key);
  if(exist){ exist.qty += m.qty; exist.mt = Date.now(); }
  else{
    state.orders.push({
      lid: newLid(), ct: Date.now(), mt: Date.now(),
      person: state.cur, guest: state.guests.includes(state.cur),
      key, name: m.it.n, emoji: m.it.e,
      temp: m.it.t==='both'? m.temp : (m.it.t==='iceOnly'?'ICE': m.it.t==='hotOnly'?'HOT': null),
      opts: optArr, unit: modalUnit(), qty: m.qty,
    });
  }
  save(); closeModal(); updateFab(); queueCartSync();
  toast(`${state.cur}님 주문에 담았어요 ✅`);
}

/* ── 같은 메뉴 1잔 추가: 누구 주문에 담을지 선택 ── */
async function addSameMenu(o){
  const everyone = [...TEAM, ...state.guests];
  const others = everyone.filter(n=>n!==o.person && !state.status[n]);
  const detail = [o.temp, ...o.opts].filter(Boolean).join('/');
  const buttons = [
    {label:`🙋 ${o.person} (그대로 +1)`, value:'same', style:'primary wide'},
    ...others.map((n,i)=>({label:n, value:'o'+i})),
    {label:'취소', value:null, style:'wide'},
  ];
  const r = await dialog({
    title:`${o.name} 1잔 추가`,
    desc:`${detail? detail+' · ':''}${won(o.unit)}<br>누구의 주문에 담을까요?`,
    grid:true, buttons,
  });
  if(!r) return;
  const target = r.v==='same'? o.person : others[+r.v.slice(1)];

  if(exist){ exist.qty += 1; exist.mt = Date.now(); }

}

/* ── 장바구니 항목의 텀블러할인 넣기/빼기 ── */
function toggleTumbler(o){
  const cat = o.key.split('|')[0];
  const it = ITEM_INDEX[cat+'|'+o.name];
  if(it && it.noTumbler){ toast('이 메뉴는 텀블러할인이 없어요'); return; }
  const has = o.opts.includes('텀블러할인');
  const newOpts = has? o.opts.filter(x=>x!=='텀블러할인') : [...o.opts, '텀블러할인'];
  const newUnit = o.unit + (has? 500 : -500);
  const newKey = [cat, o.name, o.temp||'', newOpts.join(',')].join('|');
  const dupe = state.orders.find(x=>x!==o && x.person===o.person && x.key===newKey);
  if(dupe){
    dupe.qty += o.qty; dupe.mt = Date.now();
    tombLine(o);
  } else {
    o.opts = newOpts; o.unit = newUnit; o.key = newKey; o.mt = Date.now();
  }
  save(); renderCart(); updateFab(); queueCartSync();
  toast(has? '텀블러할인을 뺐어요 (+500원)' : '🥤 텀블러할인 적용 (−500원)');
}

async function pickPayment(){

  const everyone = [...new Set([...orderers, ...TEAM, ...state.guests])];

function orderLine(o){
  const detail = [o.temp, ...o.opts].filter(Boolean).join('/');
  return `${o.name}${detail?`(${detail})`:''} ×${o.qty}`;
}
/* 주문자와 무관하게 같은 메뉴·옵션끼리 묶은 요약 (매장 주문용) */
function itemSummary(orders){
  const m = new Map();
  orders.forEach(o=>{
    const k = [o.name, o.temp||'', (o.opts||[]).join(',')].join('|');
    const e = m.get(k) || {name:o.name, temp:o.temp, opts:o.opts||[], qty:0, amt:0};
    e.qty += o.qty; e.amt += o.unit*o.qty;
    m.set(k, e);
  });
  return [...m.values()].sort((a,b)=>b.qty-a.qty);
}
function summaryDetail(e){
  return [e.temp, ...e.opts].filter(Boolean).join('/');
}
function exclGroups(){
  const g = {};
  Object.entries(state.status).forEach(([name,st])=>{ (g[st] = g[st]||[]).push(name); });
  return g;
}

  $('#rDate').textContent = `${now.getFullYear()}. ${now.getMonth()+1}. ${now.getDate()} (${'일월화수목금토'[now.getDay()]}) ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  const people = [...new Set(state.orders.map(o=>o.person))];
  people.forEach(p=>{
    const items = state.orders.filter(o=>o.person===p);
    const tr = document.createElement('tr');
    tr.innerHTML =
      `<td>${p}</td>
       <td>${items.map(o=>`<div class="d">· ${orderLine(o)} — ${won(o.unit*o.qty)}</div>`).join('')}</td>
       <td class="amt">${won(personTotal(p))}</td>`;
    body.appendChild(tr);
  });
  $('#rTotal').textContent = won(state.orders.reduce((s,o)=>s+o.unit*o.qty,0));
  const items = itemSummary(state.orders);
  $('#rItems').innerHTML = items.length?
    `<div class="ri-title">📦 메뉴별 요약 — 매장에서 이대로 주문하세요</div>` +
    items.map(e=>{
      const d = summaryDetail(e);
      return `<div class="ri-row"><span class="n">${e.name}${d?` <small>(${d})</small>`:''}</span><span class="q">×${e.qty} · ${won(e.amt)}</span></div>`;
    }).join('') : '';
  const pl = $('#rPayLine');
  if(state.payment){
    const p = state.payment;
    pl.innerHTML =
      `<span class="pay-badge ${p.type==='corp'?'corp':'pers'}">${p.type==='corp'?'🏢 법인카드':'👤 개인카드 · '+p.owner}</span>` +
      `<button class="pay-edit" id="btnPayEdit">변경</button>`;
  } else {
    pl.innerHTML =
      `<span class="pay-badge none">결제 수단 미선택</span>` +
      `<button class="pay-edit" id="btnPayEdit">선택</button>`;
  }
  $('#btnPayEdit').onclick = async ()=>{
    const p = await pickPayment();
    if(p){ state.payment = p; save(); renderSummary(); }
  };
  const g = exclGroups();
  const excl = $('#rExcl');
  const keys = Object.keys(g);
  if(keys.length){
    excl.style.display = 'block';
    excl.innerHTML = '<b>오늘 주문 제외</b><br>' +
      keys.map(st=>`${STATUS_META[st].e} ${st} — ${g[st].join(', ')}`).join('<br>');
  } else excl.style.display = 'none';
}

/* 관리자 PIN — 코드에는 SHA-256 해시만 저장되어 소스를 봐도 번호를 알 수 없다 */
const ADMIN_PIN_HASH = '38083c7ee9121e17401883566a148aa5c2e2d55dc53bc4a94a026517dbff3c6b';
async function verifyAdminPin(){
  const r = await dialog({
    title:'🔒 관리자 확인',
    desc:'통계 기록 삭제는 관리자만 할 수 있어요.<br>관리자 PIN을 입력해주세요.',
    input:true, inputType:'password', inputMode:'numeric', placeholder:'PIN 입력',
    buttons:[{label:'확인', value:'ok', style:'primary'},{label:'취소', value:null}],
  });
  if(!r || r.v!=='ok') return false;
  if(!r.input){ toast('PIN을 입력해주세요'); return false; }
  try{
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(r.input));
    const hex = [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
    if(hex === ADMIN_PIN_HASH) return true;
  }catch(e){
    toast('이 브라우저에서는 PIN 확인이 지원되지 않아요');
    return false;
  }
  toast('PIN이 올바르지 않아요 🔒');
  return false;
}

function syncCardHTML(){
  const dot = syncBusy? 'wait' : syncStatus.ok===true? 'ok' : syncStatus.ok===false? 'bad' : 'wait';
  const label = syncBusy? '동기화 중…'
    : syncStatus.ok===true? '팀 공유 통계 · 동기화됨'
    : syncStatus.ok===false? '동기화 실패 — 인터넷 연결을 확인해주세요'
    : '동기화 확인 중…';
  return `<div class="s-card sync-row">
    <span><span class="sync-dot ${dot}"></span>☁️ ${label}</span>
    <button class="sync-btn" id="btnSyncNow">↻ 동기화</button>
  </div>`;
}
function renderStats(){
  const w = $('#statsWrap');
  const H = state.history;
  if(!H.length){
    w.innerHTML = syncCardHTML() + `<div class="empty"><span class="e-ic">📊</span>아직 저장된 주문 기록이 없어요.<br>합계보기에서 ‘주문 확정’을 누르면<br>모든 기기가 함께 보는 통계가 쌓입니다.</div>`;
    const b0 = $('#btnSyncNow'); if(b0) b0.onclick = ()=>{ renderStats(); syncNow(); };
    return;
  }
  const totalAmt = H.reduce((s,h)=>s+h.total,0);
  const corpAmt  = H.filter(h=>h.payment && h.payment.type==='corp').reduce((s,h)=>s+h.total,0);
  const persAmt  = H.filter(h=>h.payment && h.payment.type==='personal').reduce((s,h)=>s+h.total,0);
  const cups     = H.reduce((s,h)=>s+h.cups,0);

  // 개인카드 결제자별
  const owners = {};
  H.filter(h=>h.payment && h.payment.type==='personal').forEach(h=>{
    const o = h.payment.owner || '미지정';
    owners[o] = owners[o] || {cnt:0, amt:0};
    owners[o].cnt++; owners[o].amt += h.total;
  });
  const ownerRows = Object.entries(owners).sort((a,b)=>b[1].amt-a[1].amt);

  // 월별 / 일별
  const months = {}, days = {};
  H.forEach(h=>{
    const m = h.date.slice(0,7);
    months[m] = months[m] || {cnt:0, corp:0, pers:0, total:0};
    months[m].cnt++; months[m].total += h.total;
    if(h.payment && h.payment.type==='corp') months[m].corp += h.total; else months[m].pers += h.total;
    days[h.date] = days[h.date] || {cups:0, corp:0, pers:0, total:0};
    days[h.date].cups += h.cups; days[h.date].total += h.total;
    if(h.payment && h.payment.type==='corp') days[h.date].corp += h.total; else days[h.date].pers += h.total;
  });
  const monthRows = Object.entries(months).sort((a,b)=>b[0].localeCompare(a[0]));
  const dayRows = Object.entries(days).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,14);

  // 인기 메뉴 / 팀원별 소비

    menu[o.name] = (menu[o.name]||0) + o.qty;

  }));
  const menuTop = Object.entries(menu).sort((a,b)=>b[1]-a[1]).slice(0,5);

  const maxMonth = Math.max(...monthRows.map(([,g])=>g.total));
  const maxDay = Math.max(...dayRows.map(([,g])=>g.total));
  const maxOwner = ownerRows.length? Math.max(...ownerRows.map(([,g])=>g.amt)) : 0;
  const maxMenu = menuTop.length? menuTop[0][1] : 0;
  const maxSpend = spendRows.length? spendRows[0][1] : 0;

  w.innerHTML = syncCardHTML() + `
    <div class="tiles">
      <div class="tile"><div class="l">누적 주문</div><div class="v">${H.length}회 · ${cups}잔</div></div>
      <div class="tile"><div class="l">누적 지출</div><div class="v">${won(totalAmt)}</div></div>
      <div class="tile"><div class="l">🏢 법인카드 누적</div><div class="v corp">${won(corpAmt)}</div><div class="s">${H.filter(h=>h.payment&&h.payment.type==='corp').length}회 결제</div></div>
      <div class="tile"><div class="l">👤 개인카드 누적</div><div class="v pers">${won(persAmt)}</div><div class="s">${H.filter(h=>h.payment&&h.payment.type==='personal').length}회 결제</div></div>
    </div>

    <div class="s-card">
      <div class="s-title">💳 결제 수단 비중</div>
      ${LEGEND}
      <div class="brow"><span class="bl">전체</span>${stack(corpAmt, persAmt, totalAmt)}<span class="bv">${won(totalAmt)}</span></div>
      <div class="s-cap">법인 ${won(corpAmt)} (${totalAmt? Math.round(corpAmt/totalAmt*100):0}%) · 개인 ${won(persAmt)} (${totalAmt? Math.round(persAmt/totalAmt*100):0}%)</div>
    </div>

    ${ownerRows.length? `
    <div class="s-card">
      <div class="s-title">👤 개인카드 결제자별 누적</div>
      ${ownerRows.map(([n,g])=>`<div class="brow"><span class="bl">${n}</span>${mono(g.amt, maxOwner).replace('mono','pers')}<span class="bv">${won(g.amt)}<small>${g.cnt}회</small></span></div>`).join('')}
      <div class="s-cap">개인카드로 대신 결제한 금액이에요. 정산할 때 참고하세요!</div>
    </div>` : ''}

    <div class="s-card">
      <div class="s-title">📅 월별 통계</div>
      ${LEGEND}

    </div>

    <div class="s-card">
      <div class="s-title">🗓 일별 통계 <span style="font-weight:700;font-size:11.5px;color:var(--ink-faint)">(최근 14일)</span></div>
      ${LEGEND}
      ${dayRows.map(([d,g])=>`<div class="brow"><span class="bl">${dayLabel(d)}</span>${stack(g.corp, g.pers, maxDay)}<span class="bv">${won(g.total)}<small>${g.cups}잔</small></span></div>`).join('')}
    </div>

    <div class="s-card">
      <div class="s-title">🏆 인기 메뉴 TOP 5</div>
      ${menuTop.map(([n,c])=>`<div class="brow"><span class="bl" style="width:110px">${n}</span>${mono(c, maxMenu)}<span class="bv">${c}잔</span></div>`).join('')}
    </div>

    <div class="s-card">
      <div class="s-title">☕ 팀원별 누적 소비 TOP 10</div>
      ${spendRows.map(([n,v])=>`<div class="brow"><span class="bl">${n}</span>${mono(v, maxSpend)}<span class="bv">${won(v)}</span></div>`).join('')}
      <div class="s-cap">확정된 주문 ${H.length}건 기준 · 진행 중인 주문은 ‘주문 확정’ 후 반영됩니다<br>☁️ 통계는 모든 기기에서 자동으로 공유됩니다</div>
    </div>
  `;
  const sb = $('#btnSyncNow');
  if(sb) sb.onclick = ()=>{ syncNow(); renderStats(); };
}

/* ───────────────────────── 토스트 ───────────────────────── */
let toastTimer = null;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ───────────────────────── 시작 ───────────────────────── */
buildMenu();
updateFab();
if(state.orders.length) show('who');
syncNow();    // 접속 시 팀 공유 통계 자동 동기화
syncCart();   // 접속 시 팀 공유 장바구니 자동 동기화
</script>
